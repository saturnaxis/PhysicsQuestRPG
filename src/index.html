<script>
'use strict';
const rooms = [
 {name:'Castle approach', floor:'Intro', kind:'lift', title:'Which way will it move?', card:'Gravity pulls the lift down. The rope pulls up. Which force needs to be larger to start lifting the platform?', goal:'Mira is stranded on the lift. Approach the marked controls and inspect the counterweights.', options:['Light counterweight','Heavy counterweight'], result:['The downward force wins. The platform settles lower.','The rope pulls harder than gravity pulls down. Mira reaches the landing.'], win:1},
 {name:'Cart track', floor:'First floor', kind:'cart', title:'Watch the gaps', card:'The tracker marks the cart at equal time intervals. Wider gaps mean the cart traveled farther in the same amount of time.', goal:'The gate opens briefly. Find the release setting that gets the cart there during the opening.', options:['Shallow ramp','Steep ramp'], result:['The cart arrives after the gate closes. Its position marks are close together.','The cart reaches the gate in time. The growing gaps show it speeding up.'], win:1},
 {name:'Lever gate', floor:'First floor', kind:'lever', title:'Farther from the hinge', card:'The same perpendicular pull produces a greater torque farther from the hinge. Look for the pivot before choosing a handle.', goal:'Use the same pull at either handle to turn the gate against its latch.', options:['Near handle','Far handle'],result:['The gate shifts, but the latch holds.','The longer lever arm produces enough torque to open the gate.'],win:1},
 {name:'Transfer track',floor:'Second floor',kind:'transfer',title:'Mass, speed, and direction',card:'Momentum depends on mass and velocity. At the same speed, the heavier cart has more momentum to share when the carts couple.',goal:'Choose an incoming cart that can move the receiving cart far enough to trip the latch. Both start at the same launch speed.',options:['4 kg cart','2 kg cart'],result:['The coupled carts reach the latch.','The carts couple and move, but stop short of the latch.'],win:0},
 {name:'Balancing bridge',floor:'Second floor',kind:'bridge',title:'Balance around the pivot',card:'A lighter load can balance a heavier load by sitting farther from the pivot. Compare the mass and distance on each side.',goal:'Balance a 4 kg load that sits 1 m left of the pivot. Place a 2 kg counterweight on the right.',options:['1 m from pivot','2 m from pivot','3 m from pivot'],result:['The fixed load still tips the bridge left.','The turning effects balance. The bridge stays level.','The counterweight tips the bridge right.'],win:1},
 {name:'Hydraulic gate',floor:'Second floor',kind:'fluid',title:'One pressure, two pistons',card:'At the same pressure, a larger piston pushes with more force. For the same volume of fluid, it also moves a shorter distance.',goal:'Both pistons get the same pressure. Choose the one that can lift the heavy gate.',options:['Wide piston','Narrow piston'],result:['The wide piston moves a short distance with enough force to lift the gate.','The narrow piston moves farther unloaded. Under the gate, it cannot lift the load.'],win:0},
 {name:'Flywheel Guardian',floor:'Guardian chamber',kind:'boss',title:'Opposing momentum',card:'Match the guardian’s momentum magnitude and launch in the opposite direction. The carts must have zero total momentum for the brake to engage.',goal:'Read the guardian’s direction. Select a cart and launch it from the opposite end of the track.',options:['2 kg × 3 m/s','5 kg × 2 m/s']}
];
const canvas=document.querySelector('canvas'), ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
const keys=new Set();
const avatars={Rowan:{coat:'#b35f35',hair:'#43251d',line:'I’ll find where the fault started.'},Sage:{coat:'#3e9b98',hair:'#372447',line:'Let’s see what the readings tell us.'}};
const consolePoint={x:360,y:260}, exit={x:650,y:178};
let avatar='', roomIndex=0, player={x:80,y:245,facing:'south',walking:false}, acquired=new Set();
let passed=false, busy=false, previous=0, time=0, animation=null, finished=false, uiZone='', attemptId=0;
const room=()=>rooms[roomIndex];
let choosing=false, choiceIndex=0, onTitle=true, sessionId=0;
let roomTransition=null, roomEntry=null;
let speech=null, repairFlash=null, observatoryRepair=null;
const motionPreference=window.matchMedia?.('(prefers-reduced-motion: reduce)');
const reducedMotion=()=>Boolean(motionPreference?.matches);
const gameMode=()=>adventure.state({onTitle,modal:!$('modal').hidden,choosing,busy,avatar,transitioning:Boolean(roomTransition)});
function canMove(){return gameMode()==='exploration';}
function canSelect(){return ['overlay','apparatus'].includes(gameMode());}
function selectDirection(direction){
 if(observatory.moveStudyProbe(direction))return;
 const lab=currentLab();
 if(lab?.adjust&&choosing&&$('modal').hidden){
  scienceLabs.adjust(lab,['ArrowLeft','ArrowDown'].includes(direction)?-1:1);
  say(dialInstructions(lab));
  saveProgress();renderActions();return;
 }
 if(canSelect())setChoice(choiceIndex+(['ArrowLeft','ArrowUp'].includes(direction)?-1:1));
}
function bringIntoView(choice){
 if(!$('modal').hidden){
  const sheet=$('sheet'), item=choice.getBoundingClientRect(), panel=sheet.getBoundingClientRect();
  if(item.bottom>panel.bottom-8)sheet.scrollTop+=item.bottom-panel.bottom+8;
  if(item.top<panel.top+8)sheet.scrollTop-=panel.top-item.top+8;
 }
}
function menuButtons(){
 if(!$('modal').hidden)return [...$('sheet').querySelectorAll('button, summary')].filter(item=>!item.disabled);
 return [];
}
function markChoice(index,choices){
 choiceIndex=(index+choices.length)%choices.length;
 choices.forEach((choice,i)=>choice.classList.toggle('key-choice',i===choiceIndex));
}
$('sheet').addEventListener('focusin',event=>{
 const choices=menuButtons();
 const index=choices.indexOf(event.target);
 if(index>=0)markChoice(index,choices);
});
function setChoice(index,{scroll=true}={}){
 const choices=menuButtons();
 if(!choices.length)return;
 markChoice(index,choices);
 choices[choiceIndex].focus({preventScroll:true});
 if(scroll&&(!speech||speech.complete||choiceIndex!==0))bringIntoView(choices[choiceIndex]);
}
function confirmChoice(){
 if(speech&&!speech.complete){revealSpeech();return;}
 if(choosing&&$('modal').hidden&&currentLab()?.adjust){runLabDial();return;}
 const choices=menuButtons();
 if(choices.length){choices[Math.min(choiceIndex,choices.length-1)].click();return;}
 interact();
}
function cancelChoice(){
 if(canMove()&&observatory.returnPart(roomIndex,observatoryState)){
  saveProgress();say('Part returned to the rack.');renderActions();return;
 }
 if(!$('modal').hidden){
  const dismiss=$('sheet').querySelector('#dismiss, #comic-skip');
  dismiss?.click();
  return;
 }
 if(busy||roomTransition)return;
 if(cancelLabControl())return;
 if(choosing){choosing=false;renderActions();return;}
 discovery();
}
const close=()=>{speech=null;$('sheet').classList.remove('vista','research-sheet','robot-story','speaker-sheet','field-sheet','relay-sheet','curiosity-sheet','study-sheet');$('modal').hidden=true;keys.clear();syncUtilityButtons();$('interact').focus({preventScroll:true});};
function showRoomMessages(expanded){
 const button=$('status-expand');
 $('status-message').classList.toggle('expanded',expanded);
 button.setAttribute('aria-expanded',String(expanded));
 button.textContent=expanded?'Less':'More';
}
function dialog(html,{focus=true}={}){
 showRoomMessages(false);
 speech=null;
 $('sheet').classList.remove('research-sheet','robot-story','speaker-sheet','field-sheet','relay-sheet','curiosity-sheet','study-sheet');
 keys.clear();padKeys.clear();choiceIndex=0;$('sheet').innerHTML=html;$('modal').hidden=false;syncUtilityButtons();
 $('sheet').scrollTop=0;
 for(const direction of priorPadDirections)blockedPadDirections.add(direction);
 if(focus)setChoice(0);
}
function portraitMarkup(name,mood){
 const portrait=portraits.get(name,mood);
 return portrait?'<img class="speaker-portrait" src="'+portrait+'" alt="" width="240" height="240">':'';
}
function showSpeech(name,message,mood,actions,{focus=true}={}){
 const portrait=portraitMarkup(name,mood);
 dialog('<div class="speaker-turn'+(portrait?'':' no-portrait')+'">'+portrait+'<div><h2>'+name+'</h2>'+

let lastInput='keyboard', stickX=0, stickY=0;
function setInputMode(input){
 if(lastInput===input)return;
 lastInput=input;
 usingPadLabels=input==='gamepad';
 for(const [id,key,padKey] of controllerLabels){
  const cap=$(id).querySelector('kbd');
  if(cap)cap.textContent=usingPadLabels?padKey:key;
  if(id==='card')$(id).lastChild.textContent=usingPadLabels?' Back':' Back / Card';
 }
 syncUtilityButtons();
}
const controllerLabels=[['interact','E','A'],['card','C','B'],['notes','N','X'],['menu','P','Y']];

function updateGamepad(now){
 let pad;
 try{pad=Array.from(navigator.getGamepads?.()||[]).find(device=>device?.mapping==='standard');}catch{}
 padKeys.clear();
 stickX=0;stickY=0;
 if(!pad){
  priorPadButtons.clear();priorPadDirections.clear();blockedPadDirections.clear();
  if(usingPadLabels)setInputMode('keyboard');
  return;
 }
 if(canMove()){
  const x=pad.axes?.[0]||0,y=pad.axes?.[1]||0;
  const strength=Math.hypot(x,y);
  if(strength>.22){
   const magnitude=Math.min(1,(strength-.22)/.78);
   stickX=magnitude*x/strength;stickY=magnitude*y/strength;
   setInputMode('gamepad');
  }
 }
 const directions=new Set(controllerDirections.filter((key,i)=>pad.buttons[12+i]?.pressed));
 if(directions.size&&[...directions].some(key=>!priorPadDirections.has(key)))setInputMode('gamepad');
 for(const key of blockedPadDirections)if(!directions.has(key))blockedPadDirections.delete(key);
 if(canSelect()){
  const available=[...directions].filter(key=>!blockedPadDirections.has(key));
  const direction=available.find(key=>!priorPadDirections.has(key))||(now>=nextPadRepeat?available[0]:null);
  if(direction){
   selectDirection(direction);
   nextPadRepeat=now+(priorPadDirections.has(direction)?160:330);
  }
 }else if(canMove()){
  for(const direction of directions)padKeys.add(direction);
 }
 priorPadDirections=directions;
 const down=new Set(padButtons.filter(([i])=>pad.buttons[i]?.pressed).map(([i])=>i));
 const pressed=padButtons.find(([i])=>down.has(i)&&!priorPadButtons.has(i));
 if(pressed){setInputMode('gamepad');music.unlock();pressed[1]();}
 priorPadButtons=down;
}

function mountCounterweight(lab,control){
 if(control.id.startsWith('weight-')){
  if(lab.carry){say('Hang the load you are holding or use Back to return it.');return;}
  lab.carry=control.detail;
  say('Carrying a '+lab.carry+' N counterweight. Take it to the lift hook.');
 }else if(lab.carry){
  const previousLoad=lab.load;
  lab.load=lab.carry;lab.carry=null;
  say(lab.load+' N is on the hook.'+(previousLoad?' The previous load returned to the rack.':'')+' Pull the lift lever to test it.');
 }else if(lab.load){
  lab.carry=lab.load;lab.load=null;
  animation=null;
  say('Lifted the '+lab.carry+' N load off the hook. Back returns it to the rack.');
 }else{
  say('Pick up a marked counterweight and hang it here.');
 }
}
function testLift(lab){
 if(!lab.load){say('Hang a counterweight on the lift hook first.');return;}
 const difference=scienceLabs.liftDifference(lab.load), win=difference>0;
 animation={start:time,win};
 const message=lab.load+' N versus 520 N, a difference of '+Math.abs(difference)+' N. '+(win?'The counterweight descends and the lift rises.':'The platform is heavier, so it does not rise.');
 performTrial(lab,'lift',win,message,1.1,{onWin:walkMira});
}
function testBrake(lab,side){
 if(lab.cartIndex===null){say('Couple one of the marked carts before using a launcher.');return;}
 const {cart,guardian,total}=scienceLabs.brakeMomenta(lab.cartIndex,side,lab.heading);
 const stopped=total===0, win=stopped&&lab.brakes===1;
 animation={start:time,side,win:stopped,index:lab.cartIndex};
 const signed=value=>value>0?'+'+value:value<0?'−'+Math.abs(value):'0';
 const nextHeading=-lab.heading;
 const message=win?'Net momentum is zero on both passes. The brake locks.':
  stopped?'The first pass stops. The guardian now travels '+(nextHeading>0?'right':'left')+'. Use the opposite launcher for the return pass.':
  'The pair is still moving '+(total>0?'right':'left')+'. The brake cannot catch.';
 const reading='Cart '+signed(cart)+', guardian '+signed(guardian)+', total '+signed(total)+' kg·m/s (right is positive). ';
 performTrial(lab,'brake',win,reading+message,.98,{
  accepted:stopped,
  onSettle(){
   animation=null;
   if(stopped){
    lab.brakes++;
    if(!win)lab.heading=nextHeading;
   }
  }
 });
}

function useLabControl(control){
 const lab=currentLab();
 if(!lab||busy||labDone()||!labReady())return;
 if(control.id!=='reset'&&readingRequired(roomIndex)){takeReading(lab,control);return;}
 if(control.id==='reset'){
  labSessions.set(roomIndex,scienceLabs.make(roomIndex));
  attempts.delete(roomIndex);
  animation=null;
  say('Experiment reset. '+labTask(currentLab()));
 }else if(control.id.startsWith('weight-')||control.id==='lift-hook'){
  mountCounterweight(lab,control);
 }else if(control.id==='lift-lever'){
  testLift(lab);
 }else if(control.id.startsWith('piston-')){
  lab.piston=control.detail;
  animation=null;
  say('Pump routed to the '+scienceLabs.equipment.pistons[lab.piston].area+' cm² piston. Set the pressure at the pump dial.');
 }else if(control.id==='hydraulic'&&lab.piston===null){
  say('Connect one of the two piston ports first.');
 }else if(control.id.startsWith('cart-')){
  lab.cartIndex=control.detail;
  const cart=scienceLabs.equipment.carts[lab.cartIndex];
  say('Coupled '+cart.mass+' kg cart · '+cart.mass*cart.speed+' kg·m/s. Walk to a launcher.');
 }else if(control.id.startsWith('launcher-')){
  testBrake(lab,control.detail);
 }else if(control.id.startsWith('lane-')){
  const index=control.detail, run=scienceLabs.friction(index);
  lab.trial={...run,index,key:'friction',started:time};
  performTrial(lab,'friction',run.win,'The sled stopped after '+scienceLabs.number(run.distance)+' m. Target zone: 2.6–3.6 m.',run.speed/run.deceleration);
 }else if(control.id.startsWith('mass-')||control.id==='plate'){
  handleLabMass(lab,control);
 }else{
  lab.adjust=control.id;
  choosing=true;
  keys.clear();padKeys.clear();
  say(dialInstructions(lab));
 }
 if(!busy)saveProgress();
 renderActions();
}

function handleLabMass(lab,control){

function runLabDial(){
 const lab=currentLab(), key=lab?.adjust;
 if(!key||busy)return;
 const value=lab.values[key];
 if(key==='hydraulic'){
  const force=scienceLabs.pistonForce(value,lab.piston), win=force>=600;
  animation={start:time,index:lab.piston,win,pressure:value,force};
  performTrial(lab,key,win,value+' kPa produces '+force+' N. The gate needs 600 N.',1.05);
 }else if(key==='crank'){
  const torque=scienceLabs.crankTorque(value), win=torque>=18;
  if(win)bridgeStart=time;
  performTrial(lab,key,win,value+' cm at 50 N produces '+torque+' N·m. The bridge needs 18 N·m.',.95,{
   onWin(){gardenBridge=true;bridgeStart=null;}
  });
 }else if(key==='momentum'){
  const run=scienceLabs.collision(value);
  lab.trial={...run,key,started:time};
  performTrial(lab,key,run.win,'The joined carts rolled '+scienceLabs.number(run.distance)+' m. Target zone: 1.7–2.3 m.',run.approachTime+run.coupledSpeed);
 }else if(key==='force'){
  const net=scienceLabs.force(value);
  performTrial(lab,key,net===0,'Net force: '+scienceLabs.netForceLabel(net)+'.',.75);
 }else{
  const net=scienceLabs.torque(value);
  performTrial(lab,key,Math.abs(net)<=2,'Net torque: '+scienceLabs.number(Math.abs(net))+' N·m'+(net?(net>0?' clockwise.':' counterclockwise.'):'.'),.75);
 }
}
function performTrial(lab,key,win,message,seconds,{accepted=win,onSettle,onWin}={}){
 const token=++attemptId;
 const dial=Boolean(lab.adjust);
 busy=true;choosing=false;
 say(key==='force'||key==='torque'?'Holding the setting to check equilibrium…':'Running the experiment…');
 renderActions();
 setTimeout(()=>{
  if(token!==attemptId)return;
  busy=false;
  onSettle?.();
  if(roomIndex!==9)passed=win;
  if(win)lab.adjust=null;
  choosing=dial&&!win;
  if(win)onWin?.();
  if(key==='friction')lab.lastTrial={index:lab.trial.index};
  if(key==='momentum')lab.lastTrial={speed:lab.trial.speed};
  lab.lastFeedback=scienceLabs.result(lab,key,win?message+' Repair complete.':message,accepted);
  say(lab.lastFeedback);
  renderActions();
  saveProgress();
 },seconds*1000);
}

function treeCollision(index,x,y){
 if(![0,9,10,11,14].includes(index))return false;
 return treeSites.some(([tx,ty])=>{
  if(([0,9].includes(index)&&tx>70&&tx<285)||(index===11&&tx>=140&&tx<=214))return false;
  return Math.abs(x-tx*2)<22&&Math.abs(y-ty*2)<15;
 });
}
function patrol(now){

 if(!person||!route)return;
 person.walking=false;
 if(!avatar||!$('modal').hidden||nearby(person,42))return;
 const target=route[person.waypoint??0];
 const dx=target[0]-person.x,dy=target[1]-person.y;
 const distance=Math.hypot(dx,dy);
 if(distance<1){person.waypoint=((person.waypoint??0)+1)%route.length;return;}
 const speed=Math.min(distance,49*Math.min(.04,Math.max(0,(now-previous)/1000)));
 const x=person.x+dx/distance*speed,y=person.y+dy/distance*speed;
 if(adventure.walkable(x,y,blocks,students[roomIndex]||[])){
  person.x=x;person.y=y;person.walking=speed>0;person.facing=adventure.face(person.facing,dx,dy);

}

function draw(){
 ctx.imageSmoothingEnabled=false;
 const transition=roomTransition;
 const strength=transition?Math.max(0,1-Math.abs(transition.elapsed/passageHalf-1)):0;
 const ease=strength*strength*(3-2*strength);
 if(transition){
  rect(0,0,720,360,'#0d1317');
  const {dx,dy}=threshold[transition.door.dir];
  const offset=transition.portal?0:Math.round((transition.switched?1:-1)*16*ease);
  ctx.save();ctx.translate(dx*offset,dy*offset);
 }
 const inObservatory=observatory.inside(roomIndex);
 if(inObservatory){
  const doors=links[roomIndex].filter(door=>door.to!==observatory.secret||roomIndex!==observatory.lobby||observatoryState.aligned).map(door=>({
   dir:door.dir,point:threshold[door.dir],open:isOpen(door),
   gate:door.to===observatory.offworld||roomIndex===observatory.offworld,
   label:door.to===observatory.secret?'SIGNAL':door.to===observatory.offworld?'NACRE':
    roomIndex===observatory.offworld?'RETURN':roomIndex===observatory.secret?'LOBBY':
    door.to===observatory.floorFor(roomIndex)?.side?'STUDY':roomIndex===observatory.floorFor(roomIndex)?.side?'LAB':
    ({north:'UP',south:'DOWN'})[door.dir]}));
  if(roomIndex===observatory.lobby){
   const next=observatory.nextFloor(observatoryState);
   const stairs=doors.find(door=>door.dir==='north');
   if(next&&stairs)stairs.label='TO FLOOR '+(next.index+1);
   doors.push({dir:'south',point:observatory.exit,open:true,label:'VALLEY'});
  }
  const still=reducedMotion();
  const elapsed=observatoryRepair?performance.now()-observatoryRepair.start:900;
  if(still||elapsed>=900)observatoryRepair=null;
  const phase=observatoryRepair?.room===roomIndex?elapsed/900:1;
  observatory.drawRoom(roomIndex,{rect,line,label},observatoryState,doors,still?0:time,phase);
 }
 else drawAdventureRoom();
 questExtras.draw(roomIndex,curiosities,{rect,label});
 const figures=observatory.backgroundPeople(roomIndex).map(person=>({point:person,look:person,facing:person.facing}));
 for(const person of observatory.people(roomIndex,observatoryState))figures.push({point:person,look:person,facing:observatoryFacing.get(person.name)||'south'});
 const op=operatorPoint(), npc=roomIndex===9?null:talkPoint();
 if(op)figures.push({point:op,look:{coat:operatorCoats[roomIndex],hair:'#53484a'},facing:operatorFacing.get(roomIndex)||'south'});

 for(const student of students[roomIndex]||[])figures.push({point:student,look:student,facing:student.facing||'north'});
 if(avatar&&!onTitle)figures.push({point:player,look:avatars[avatar],facing:player.facing,load:currentLab()?.carry});

 if(labSetup&&avatar&&!onTitle&&observatory.floorFor(roomIndex)?.room===roomIndex&&labSetup.carry!==null){
  rect(player.x-18,player.y-37,36,13,'#263438');

 if(avatar&&!onTitle&&roomIndex===observatory.floors[3].room&&labSetup.coil.compass&&(labSetup!==observatoryState||!observatory.done(observatoryState,3))){

 }
 if(transition){

  const shade=transition.portal?'22,31,51':'13,19,23';

 }
